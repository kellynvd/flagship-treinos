<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181C">
<title>FlagShip 1.0 · Reorganizado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font: "Archivo", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --maxw: 780px;
  --r: 14px; --r-sm: 10px;
  --sp: 20px;
  --tap: 46px;
}
html[data-theme="dark"]{
  --bg:#17181C; --bg-elev:#1F2127; --bg-elev2:#262932; --bg-input:#15161A;
  --text:#ECEDF0; --dim:#A2A6B0; --faint:#6C7080;
  --border:#2C2F38; --border-2:#3A3E49;
  --accent:#4C8DFF; --accent-soft:rgba(76,141,255,.14); --on-accent:#0A1220;
  --good:#38C88C; --good-soft:rgba(56,200,140,.14);
  --warn:#E7B93E;
  --amber:#E7B93E; --red:#F26D5B; --teal:#3FC6C0; --violet:#9E86F0; --blue:#4C8DFF; --gray:#7B8090;
  --shadow: 0 1px 0 rgba(255,255,255,.02), 0 8px 24px rgba(0,0,0,.28);
}
html[data-theme="light"]{
  --bg:#F1F2F5; --bg-elev:#FFFFFF; --bg-elev2:#F8F9FB; --bg-input:#FFFFFF;
  --text:#14151A; --dim:#565A66; --faint:#8A8F9C;
  --border:#E4E6EB; --border-2:#D3D6DE;
  --accent:#1F6FEB; --accent-soft:rgba(31,111,235,.10); --on-accent:#FFFFFF;
  --good:#0F9A6A; --good-soft:rgba(15,154,106,.12);
  --warn:#9A7411;
  --amber:#B5860B; --red:#D65440; --teal:#0E9E97; --violet:#6D54D6; --blue:#1F6FEB; --gray:#8A8F9C;
  --shadow: 0 1px 2px rgba(20,21,26,.05), 0 8px 22px rgba(20,21,26,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-feature-settings:"tnum" 1, "cv05" 1;
  line-height:1.5; overflow-y:scroll;
}
button{font-family:inherit}
input,textarea{font-family:inherit}
a{color:inherit}
::selection{background:var(--accent-soft)}

.wrap{max-width:var(--maxw); margin:0 auto; padding:0 var(--sp);}
.pad-top{padding-top:calc(env(safe-area-inset-top) + 14px)}

/* ---------- Top bar ---------- */
.topbar{position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--border);}
.topbar-in{max-width:var(--maxw); margin:0 auto; padding:0 var(--sp);
  min-height:58px; display:flex; align-items:center; gap:12px;
  padding-top:calc(env(safe-area-inset-top))}
.brand{display:flex; align-items:center; gap:11px; font-weight:800; letter-spacing:-.02em; cursor:pointer; background:none; border:0; color:var(--text); padding:8px 4px; margin-left:-4px; font-size:17px;}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);position:relative;flex:none;box-shadow:inset 0 0 0 3px var(--bg-elev), inset 0 0 0 6px var(--accent)}
.brand small{font-weight:500;color:var(--faint);font-size:12px;letter-spacing:0}
.spacer{flex:1}
.iconbtn{height:var(--tap);min-width:var(--tap);border-radius:11px;border:1px solid var(--border);
  background:var(--bg-elev); color:var(--text); cursor:pointer; display:inline-flex; align-items:center;
  justify-content:center; gap:8px; padding:0 12px; font-size:14px; font-weight:600; transition:border-color .15s, background .15s;}
.iconbtn:hover{border-color:var(--border-2)}
.iconbtn:active{transform:translateY(1px)}
.iconbtn svg{width:19px;height:19px;display:block}
.iconbtn.only{padding:0}

/* ---------- Home ---------- */
.home-hero{padding:34px 0 8px}
.eyebrow{color:var(--faint); font-weight:600; font-size:13px}
.home-hero h1{margin:.15em 0 .1em; font-size:clamp(28px,7vw,40px); line-height:1.05; letter-spacing:-.035em; font-weight:800}
.home-hero p{margin:.4em 0 0; color:var(--dim); max-width:52ch; font-size:15px}
.overall{display:flex; gap:22px; flex-wrap:wrap; margin-top:22px; padding:16px 18px; border:1px solid var(--border);
  border-radius:var(--r); background:var(--bg-elev)}
.stat b{display:block; font-size:24px; font-weight:800; letter-spacing:-.02em}
.stat span{color:var(--faint); font-size:12.5px; font-weight:600}

.section-title{margin:30px 0 12px; font-size:13px; font-weight:700; color:var(--faint); letter-spacing:.02em}
.prog-grid{display:grid; gap:14px; grid-template-columns:1fr}
.pcard{display:block; text-align:left; width:100%; border:1px solid var(--border); background:var(--bg-elev);
  border-radius:var(--r); padding:20px; cursor:pointer; color:inherit; transition:border-color .15s, transform .05s;
  box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--border-2)}
.pcard:active{transform:translateY(1px)}
.pcard-top{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.pcard h3{margin:0; font-size:22px; letter-spacing:-.02em; font-weight:800}
.pcard .pct{font-size:22px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.pcard .meta{color:var(--dim); font-size:13.5px; margin-top:3px; font-weight:500}
.track{height:8px; border-radius:99px; background:var(--bg-elev2); margin-top:15px; overflow:hidden; border:1px solid var(--border)}
.track > i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .3s ease}
.pcard.done .track > i{background:var(--good)}
.pcard-foot{display:flex; align-items:center; justify-content:space-between; margin-top:13px}
.pcard-foot span{color:var(--faint); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums}
.chip-go{font-size:13px; font-weight:700; color:var(--accent); display:inline-flex; align-items:center; gap:6px}

/* ---------- Selectors (week/day) ---------- */
.selbar{position:sticky; z-index:30; background:var(--bg); border-bottom:1px solid var(--border);
  top:calc(env(safe-area-inset-top) + 58px);}
.selbar-in{max-width:var(--maxw); margin:0 auto; padding:12px var(--sp) 13px}
.sel-row{display:flex; align-items:center; gap:10px}
.sel-label{font-size:12px; font-weight:700; color:var(--faint); width:58px; flex:none}
.scroller{display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding:2px 0; scroll-padding:0 40px}
.scroller::-webkit-scrollbar{display:none}
.wk{flex:none; min-width:38px; height:36px; padding:0 10px; border-radius:9px; border:1px solid var(--border);
  background:var(--bg-elev); color:var(--dim); font-weight:700; font-size:14px; cursor:pointer; position:relative;
  font-variant-numeric:tabular-nums; transition:background .12s, color .12s, border-color .12s}
.wk:hover{border-color:var(--border-2)}
.wk[data-active="1"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.wk .dot{position:absolute; top:5px; right:5px; width:5px; height:5px; border-radius:99px; background:var(--good)}
.wk[data-active="1"] .dot{background:var(--on-accent)}
.day-tabs{display:flex; gap:7px; margin-top:10px}
.day-tabs .wk{flex:1; min-width:0; height:40px; display:flex; align-items:center; justify-content:center; gap:7px}
.day-tabs .wk.named{font-size:12.5px; font-weight:700; white-space:nowrap; padding:0 4px; letter-spacing:-.01em}
.day-tabs .wk small{font-size:11px;font-weight:600;opacity:.8}
.wk.empty{opacity:.42}

/* ---------- Day header ---------- */
.dayhead{padding:22px 0 6px}
.crumb{color:var(--faint); font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px}
.crumb .mid{opacity:.5}
.dayhead h2{margin:6px 0 0; font-size:clamp(24px,6vw,32px); letter-spacing:-.03em; font-weight:800; line-height:1.08}
.daymeta{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:12px}
.mini{display:inline-flex; align-items:center; gap:8px; color:var(--dim); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums}
.mini .ring{--p:0; width:22px;height:22px;border-radius:99px; flex:none;
  background:conic-gradient(var(--good) calc(var(--p)*1%), var(--bg-elev2) 0);
  -webkit-mask:radial-gradient(circle 6.5px at center, transparent 98%, #000 100%);
          mask:radial-gradient(circle 6.5px at center, transparent 98%, #000 100%);}

.controls{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}
.datefield{display:inline-flex; align-items:center; gap:9px; border:1px solid var(--border); background:var(--bg-elev);
  border-radius:11px; padding:0 12px; height:var(--tap)}
.datefield label{font-size:12px; font-weight:700; color:var(--faint)}
.datefield input{border:0; background:transparent; color:var(--text); font-size:14px; font-weight:600; outline:none; padding:6px 0; width:130px}
.datefield input::-webkit-calendar-picker-indicator{filter:var(--cal-filter)}
html[data-theme="dark"]{--cal-filter:invert(.8)}
html[data-theme="light"]{--cal-filter:none}
.btn-done{flex:1; min-width:210px; height:var(--tap); border-radius:11px; cursor:pointer; font-weight:700; font-size:15px;
  border:1px solid var(--accent); background:var(--accent); color:var(--on-accent); display:inline-flex;
  align-items:center; justify-content:center; gap:9px; transition:filter .15s}
.btn-done:hover{filter:brightness(1.05)}
.btn-done:active{transform:translateY(1px)}
.btn-done.is-done{background:var(--good-soft); border-color:var(--good); color:var(--good)}
.btn-done svg{width:19px;height:19px}

.gnotes{margin-top:14px}
.gnotes textarea{width:100%; min-height:52px; resize:vertical; border:1px solid var(--border); background:var(--bg-input);
  color:var(--text); border-radius:12px; padding:12px 14px; font-size:14px; outline:none; line-height:1.5}
.gnotes textarea:focus{border-color:var(--accent)}
.gnotes textarea::placeholder{color:var(--faint)}

/* ---------- Workout sections & cards ---------- */
.workout{padding:8px 0 40px}
.sec{margin-top:26px}
.sec-head{display:flex; align-items:center; gap:10px; margin:0 0 12px; padding-left:2px}
.sec-tick{width:12px;height:12px;border-radius:4px;flex:none}
.sec-head h4{margin:0; font-size:15px; font-weight:800; letter-spacing:-.01em; text-transform:capitalize}
.sec-head .count{color:var(--faint); font-size:12.5px; font-weight:600; margin-left:auto; font-variant-numeric:tabular-nums}

.card{border:1px solid var(--border); border-left:3px solid var(--sec-c, var(--border-2)); background:var(--bg-elev);
  border-radius:var(--r); padding:16px 16px 14px; margin-bottom:12px; box-shadow:var(--shadow); transition:border-color .15s, background .2s}
.card.checked{background:color-mix(in srgb, var(--bg-elev) 82%, var(--good-soft))}
.card-main{display:flex; gap:13px; align-items:flex-start}
.check{--sz:26px; width:var(--sz); height:var(--sz); border-radius:8px; border:2px solid var(--border-2);
  background:var(--bg-elev2); flex:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  margin-top:1px; transition:background .15s, border-color .15s}
.check:hover{border-color:var(--accent)}
.check svg{width:16px;height:16px;color:var(--on-accent); opacity:0; transform:scale(.6); transition:opacity .12s, transform .12s}
.check[aria-checked="true"]{background:var(--good); border-color:var(--good)}
.check[aria-checked="true"] svg{opacity:1; transform:scale(1)}
.exbody{flex:1; min-width:0}
.ex-title{font-size:17px; font-weight:800; letter-spacing:-.015em; line-height:1.25; word-wrap:break-word}
.card.checked .ex-title{color:var(--dim)}
.rx{margin-top:5px}
.rx .line{font-size:15.5px; font-weight:600; line-height:1.42; color:var(--text); white-space:pre-wrap; word-wrap:break-word; letter-spacing:-.005em}
.rx .line + .line{margin-top:1px}
.rx .note{font-size:13.5px; font-weight:500; line-height:1.5; color:var(--dim); white-space:pre-wrap; word-wrap:break-word}
.rx .spacer{height:7px}
.rx .noteshead{font-size:12px; font-weight:700; color:var(--faint); margin-top:8px; letter-spacing:.02em}

.log{display:flex; gap:10px; margin-top:13px; padding-top:13px; border-top:1px solid var(--border)}
.log .fld{flex:1; min-width:0}
.log .fld.carga{max-width:44%}
.log label{display:block; font-size:11.5px; font-weight:700; color:var(--faint); margin:0 0 5px 2px}
.log input{width:100%; height:40px; border:1px solid var(--border); background:var(--bg-input); color:var(--text);
  border-radius:10px; padding:0 12px; font-size:14px; font-weight:600; outline:none}
.log input:focus{border-color:var(--accent)}
.log input::placeholder{color:var(--faint); font-weight:500}

/* ---------- Empty / rest states ---------- */
.empty-state{border:1px dashed var(--border-2); border-radius:var(--r); padding:40px 24px; text-align:center; margin-top:26px; background:var(--bg-elev)}
.empty-state .big{font-size:17px; font-weight:700}
.empty-state p{color:var(--dim); margin:8px auto 0; max-width:40ch; font-size:14px}

/* ---------- History ---------- */
.hist-head{padding:30px 0 6px}
.hist-head h1{margin:0; font-size:clamp(26px,6vw,34px); letter-spacing:-.03em; font-weight:800}
.hist-head p{color:var(--dim); margin:.4em 0 0; font-size:14.5px}
.hist-list{margin-top:18px; display:flex; flex-direction:column; gap:0; border:1px solid var(--border); border-radius:var(--r); overflow:hidden; background:var(--bg-elev)}
.hrow{display:flex; align-items:center; gap:14px; padding:15px 16px; cursor:pointer; text-align:left; width:100%;
  background:none; border:0; border-bottom:1px solid var(--border); color:inherit; transition:background .12s}
.hrow:last-child{border-bottom:0}
.hrow:hover{background:var(--bg-elev2)}
.hrow .date{font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; width:96px; flex:none; letter-spacing:-.01em}
.hrow .date small{display:block; font-size:11px; font-weight:600; color:var(--faint)}
.hrow .what{flex:1; min-width:0}
.hrow .what b{font-weight:700; font-size:15px}
.hrow .what span{display:block; color:var(--dim); font-size:13px; font-weight:600}
.hrow .arw{color:var(--faint); flex:none}
.date-group{padding:20px 2px 6px; font-size:12.5px; font-weight:700; color:var(--faint)}

/* ---------- Sheet (settings) ---------- */
.scrim{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.open{opacity:1; pointer-events:auto}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--bg-elev); border-top:1px solid var(--border-2);
  border-radius:20px 20px 0 0; padding:10px var(--sp) calc(env(safe-area-inset-bottom) + 22px);
  transform:translateY(102%); transition:transform .26s cubic-bezier(.22,.61,.36,1); max-width:var(--maxw); margin:0 auto;
  box-shadow:0 -12px 40px rgba(0,0,0,.28)}
.sheet.open{transform:translateY(0)}
.sheet .grip{width:38px;height:4px;border-radius:99px;background:var(--border-2);margin:8px auto 14px}
.sheet h3{margin:2px 2px 14px;font-size:18px;font-weight:800;letter-spacing:-.02em}
.sheet .opt{width:100%; text-align:left; display:flex; align-items:center; gap:13px; padding:14px 4px; background:none;
  border:0; border-top:1px solid var(--border); color:var(--text); font-size:15px; font-weight:600; cursor:pointer}
.sheet .opt:hover{color:var(--accent)}
.sheet .opt svg{width:19px;height:19px;color:var(--faint)}
.sheet .opt.danger{color:var(--red)} .sheet .opt.danger svg{color:var(--red)}
.sheet .opt small{display:block;font-weight:500;color:var(--faint);font-size:12.5px;margin-top:2px}

/* ---------- Toast ---------- */
.toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translate(-50%,20px);
  background:var(--text); color:var(--bg); font-weight:700; font-size:14px; padding:12px 18px; border-radius:12px;
  z-index:80; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1; transform:translate(-50%,0)}

.footlink{padding:26px 0 40px; text-align:center; color:var(--faint); font-size:12.5px}
.footlink a{color:var(--dim); text-decoration:none; border-bottom:1px solid var(--border-2)}

@media (min-width:640px){
  .prog-grid{grid-template-columns:1fr}
  .log .fld.carga{max-width:220px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important; scroll-behavior:auto !important}
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <button class="brand" id="brandBtn" aria-label="Início">
    <span class="mark"></span>
    <span>FlagShip <small>1.0</small></span>
  </button>
  <div class="spacer"></div>
  <button class="iconbtn only" id="histBtn" title="Histórico" aria-label="Histórico">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
  </button>
  <button class="iconbtn only" id="settingsBtn" title="Ajustes" aria-label="Ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div></div>

<div id="selbarHost"></div>
<main id="app" class="wrap"></main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Ajustes">
  <div class="grip"></div>
  <h3>Ajustes</h3>
  <button class="opt" id="optTheme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
    <span>Tema <small id="themeState">Escuro</small></span>
  </button>
  <button class="opt" id="optExport">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    <span>Exportar meus dados <small>Backup em arquivo .json</small></span>
  </button>
  <button class="opt" id="optImport">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg>
    <span>Importar dados <small>Restaurar de um backup</small></span>
  </button>
  <button class="opt danger" id="optReset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    <span>Apagar todo o progresso <small>Não pode ser desfeito</small></span>
  </button>
</div>

<script>
"use strict";
/* ============================ Dados ============================ */
const DB = JSON.parse(document.getElementById('data').textContent);
const PROGRAMS = DB.programs;
const P_BY_ID = Object.fromEntries(PROGRAMS.map(p => [p.id, p]));

/* Índices auxiliares por programa: totais e ordem de dias "contáveis" */
const P_INDEX = {};
for (const p of PROGRAMS){
  const order = [];           // [{w,d}] apenas dias contáveis, em ordem
  const dayMap = {};          // "w-d" -> day
  let total = 0;
  for (const wk of p.weeks){
    for (const day of wk.days){
      dayMap[wk.w + '-' + day.d] = day;
      if (day.c) { order.push({w:wk.w, d:day.d}); total++; }
    }
  }
  P_INDEX[p.id] = {order, dayMap, total, weeks:p.weeks.length};
}

/* ============================ Estado / persistência ============================ */
const KEY = 'flagship-reorg:v1';
const OLD_KEY = 'flagship1:v1', OLD_PID = 'flagship-1-0';
const store = (() => {
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return localStorage; }
  catch(e){ const m={}; return {getItem:k=>k in m?m[k]:null, setItem:(k,v)=>{m[k]=String(v)}, removeItem:k=>{delete m[k]}}; }
})();
let STATE = load();
function load(){
  try { const raw = store.getItem(KEY); if (raw) return JSON.parse(raw); } catch(e){}
  /* primeira abertura: traz o histórico das semanas 1–2 do app original (mesmo domínio) */
  try {
    const old = JSON.parse(store.getItem(OLD_KEY)||'null');
    if (old && old.progress){
      const progress = {};
      for (const k in old.progress){
        const [pid,w,d] = k.split('#');
        if (pid===OLD_PID && +w<=2) progress[PROGRAMS[0].id+'#'+w+'#'+d] = old.progress[k];
      }
      return { theme: old.theme||'dark', progress };
    }
  } catch(e){}
  const initTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  return { theme: initTheme, progress: {} };
}
let saveTimer=null;
function save(now){
  clearTimeout(saveTimer);
  const fn = () => { try { store.setItem(KEY, JSON.stringify(STATE)); } catch(e){} };
  if (now) fn(); else saveTimer = setTimeout(fn, 250);
}
function dayKey(pid,w,d){ return pid+'#'+w+'#'+d; }
function getDay(pid,w,d){
  const k = dayKey(pid,w,d);
  if (!STATE.progress[k]) STATE.progress[k] = { done:false, date:null, notes:'', blocks:{} };
  return STATE.progress[k];
}
function peekDay(pid,w,d){ return STATE.progress[dayKey(pid,w,d)] || null; }

/* ============================ Utilidades ============================ */
const $ = (s,r=document)=>r.querySelector(s);
function el(tag, attrs, children){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k==='class') n.className=attrs[k];
    else if (k==='html') n.innerHTML=attrs[k];
    else if (k==='text') n.textContent=attrs[k];
    else if (k.startsWith('on') && typeof attrs[k]==='function') n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k]!=null && attrs[k]!==false) n.setAttribute(k, attrs[k]);
  }
  if (children!=null){ (Array.isArray(children)?children:[children]).forEach(c=>{ if(c==null)return; n.appendChild(typeof c==='string'?document.createTextNode(c):c); }); }
  return n;
}
function titleCase(s){
  if(!s) return '';
  return s.toLowerCase().replace(/\b([a-zà-ú0-9])([a-zà-ú0-9'()&/-]*)/gi,(m,a,b)=>a.toUpperCase()+b);
}
function sectionColorVar(label){
  const l = (label||'').toLowerCase();
  if (!l) return 'var(--gray)';
  if (l.includes('warm')) return 'var(--amber)';
  if (l.includes('metcon')||l.includes('cardio')||l.includes('condition')||l.includes('swim')||l.includes('spin')||l.includes('bike')||l.includes('row')||l.includes('farmers')||l.includes('carry')) return 'var(--red)';
  if (l.includes('weightlifting')) return 'var(--teal)';
  if (l.includes('bodybuilding')||l.includes('accessor')||l.includes('core')||l.includes('bonus')) return 'var(--violet)';
  if (l.includes('rest')||l.includes('optional day')||l.includes('note')||l.includes('tip')||l.includes('cycle')||l.includes('custom')||l.includes('descanso')) return 'var(--gray)';
  return 'var(--blue)';
}
const WD = ['Dia 1','Dia 2','Dia 3','Dia 4','Dia 5','Dia 6','Dia 7'];
const SHORT = {'Pernas A':'Pernas A','Superior A':'Sup. A','Full body leve':'Full body','Pernas B':'Pernas B','Superior B':'Sup. B'};
function dayObj(pid,w,d){ return P_INDEX[pid].dayMap[w+'-'+d]; }
function dayName(pid,w,d){ const o=dayObj(pid,w,d); return (o && o.n) ? o.n : WD[d-1]; }
function fmtDateBR(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y;
}
function todayISO(){
  const t=new Date(); const z=n=>String(n).padStart(2,'0');
  return t.getFullYear()+'-'+z(t.getMonth()+1)+'-'+z(t.getDate());
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900);
}
async function shareDay(pid,w,d){
  const p=P_BY_ID[pid];
  const url=location.href;                       // link absoluto já inclui a rota do dia (#/.../w/d)
  const title=p.name+' — Semana '+w+' · '+dayName(pid,w,d);
  if (navigator.share){
    try{ await navigator.share({title, url}); return; }
    catch(err){ if(err && err.name==='AbortError') return; /* segue pro fallback */ }
  }
  try{
    await navigator.clipboard.writeText(url);
    toast('Link copiado');
  }catch(err){
    window.prompt('Copie o link deste treino:', url);
  }
}

/* Contagem de blocos e concluídos de um dia (todos os blocos têm checkbox) */
function dayBlockStats(pid, wk, day){
  let total=0, done=0; const prog = peekDay(pid, wk.w, day.d);
  day.sec.forEach((s,si)=> s.b.forEach((b,bi)=>{
    total++;
    if (prog && prog.blocks[si+'.'+bi] && prog.blocks[si+'.'+bi].done) done++;
  }));
  return {total, done};
}
function programStats(p){
  const idx = P_INDEX[p.id]; let done=0;
  for (const {w,d} of idx.order){ const pr = peekDay(p.id,w,d); if (pr && pr.done) done++; }
  const pct = idx.total? Math.round(done/idx.total*100):0;
  return {done, total:idx.total, pct};
}
function nextIncomplete(pid){
  const idx=P_INDEX[pid];
  for (const {w,d} of idx.order){ const pr=peekDay(pid,w,d); if (!pr || !pr.done) return {w,d}; }
  return idx.order[0] || {w:1,d:1};
}

/* ============================ Tema ============================ */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', STATE.theme);
  const meta=document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content', STATE.theme==='dark'?'#17181C':'#F1F2F5');
  const ts=$('#themeState'); if(ts) ts.textContent = STATE.theme==='dark'?'Escuro':'Claro';
}
function toggleTheme(){ STATE.theme = STATE.theme==='dark'?'light':'dark'; applyTheme(); save(true); }

/* ============================ Roteador ============================ */
function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  if (!h) return {name:'home'};
  const parts = h.split('/').filter(Boolean);
  if (parts[0]==='history') return {name:'history'};
  if (P_BY_ID[parts[0]]){
    const pid=parts[0];
    const w = Math.max(1, Math.min(P_INDEX[pid].weeks, parseInt(parts[1]||'1',10)||1));
    const wo = P_BY_ID[pid].weeks.find(x=>x.w===w);
    const d = Math.max(1, Math.min(wo ? wo.days.length : 7, parseInt(parts[2]||'1',10)||1));
    return {name:'day', pid, w, d};
  }
  return {name:'home'};
}
function go(hash){ location.hash = hash; }
window.addEventListener('hashchange', render);

/* ============================ Views ============================ */
function render(){
  const r = parseHash();
  $('#selbarHost').innerHTML='';
  window.scrollTo({top:0, behavior:'auto'});
  if (r.name==='home') return renderHome();
  if (r.name==='history') return renderHistory();
  if (r.name==='day') return renderDay(r.pid, r.w, r.d);
  renderHome();
}

function renderHome(){
  const app=$('#app'); app.innerHTML='';
  let gDone=0, gTotal=0;
  const cards = PROGRAMS.map(p=>{
    const st = programStats(p); gDone+=st.done; gTotal+=st.total;
    const nx = nextIncomplete(p.id);
    const isDone = st.total>0 && st.done>=st.total;
    const card = el('button',{class:'pcard'+(isDone?' done':''), onclick:()=>go('/'+p.id+'/'+nx.w+'/'+nx.d)},[
      el('div',{class:'pcard-top'},[
        el('h3',{text:p.name}),
        el('div',{class:'pct',text:st.pct+'%'})
      ]),
      el('div',{class:'meta',text:P_INDEX[p.id].weeks+' semanas · 5 treinos/semana a partir da semana 3'}),
      el('div',{class:'track'},[ el('i',{style:'width:'+st.pct+'%'}) ]),
      el('div',{class:'pcard-foot'},[
        el('span',{text:st.done+' de '+st.total+' treinos concluídos'}),
        el('span',{class:'chip-go',html:(st.done>0?'Continuar':'Começar')+' &nbsp;›'})
      ])
    ]);
    return card;
  });
  const gpct = gTotal?Math.round(gDone/gTotal*100):0;
  app.append(
    el('section',{class:'home-hero'},[
      el('div',{class:'eyebrow',text:'FlagShip 1.0 · versão reorganizada'}),
      el('h1',{text:'Seus treinos, prontos para treinar.'}),
      el('p',{text:'A partir da semana 3: Pernas A, Superior A, Full body leve, Pernas B e Superior B. Sem clean e snatch (trocados por box jump, kettlebell swing e variações) e sem os dias de spin/natação — o aeróbico fica com a sua corrida.'}),
      el('div',{class:'overall'},[
        el('div',{class:'stat'},[ el('b',{text:String(gDone)}), el('span',{text:'treinos concluídos'}) ]),
        el('div',{class:'stat'},[ el('b',{text:String(gTotal)}), el('span',{text:'treinos no total'}) ]),
        el('div',{class:'stat'},[ el('b',{text:gpct+'%'}), el('span',{text:'do programa'}) ]),
      ])
    ]),
    el('div',{class:'section-title',text:'Programa'}),
    el('div',{class:'prog-grid'}, cards),
    el('div',{class:'footlink'},[
      document.createTextNode('Dados importados de '),
      el('a',{href:DB.meta.source, target:'_blank', rel:'noopener', text:'FlagShip 1.0'}),
      document.createTextNode('. Semanas 1–2 como no original; semanas 3+ reorganizadas.')
    ])
  );
}

function buildSelbar(pid, curW, curD){
  const p = P_BY_ID[pid]; const idx=P_INDEX[pid];
  const host = $('#selbarHost');
  const bar = el('div',{class:'selbar'});
  const inn = el('div',{class:'selbar-in'});

  // Semanas
  const wkRow = el('div',{class:'sel-row'});
  wkRow.append(el('div',{class:'sel-label',text:'Semana'}));
  const wkScroller = el('div',{class:'scroller', id:'wkScroller'});
  p.weeks.forEach(wk=>{
    // uma semana está "feita" se todos os seus dias contáveis estão done
    const countable = wk.days.filter(dd=>dd.c);
    const allDone = countable.length>0 && countable.every(dd=>{ const pr=peekDay(pid,wk.w,dd.d); return pr&&pr.done; });
    const b = el('button',{class:'wk', 'data-active':wk.w===curW?'1':'0', 'data-w':wk.w,
      onclick:()=>go('/'+pid+'/'+wk.w+'/'+curD), text:String(wk.w)});
    if (allDone) b.append(el('span',{class:'dot'}));
    wkScroller.append(b);
  });
  wkRow.append(wkScroller);
  inn.append(wkRow);

  // Dias
  const dayTabs = el('div',{class:'day-tabs'});
  const wkObj = p.weeks.find(x=>x.w===curW);
  const nDays = wkObj.days.length;
  for (let d=1; d<=nDays; d++){
    const day = wkObj.days.find(x=>x.d===d);
    const empty = !day || day.st!=='p';
    const pr = peekDay(pid,curW,d);
    const done = pr && pr.done;
    const b = el('button',{class:'wk'+(empty?' empty':''), 'data-active':d===curD?'1':'0',
      onclick:()=>go('/'+pid+'/'+curW+'/'+d)},[
      document.createTextNode(day && day.n ? (SHORT[day.n]||day.n) : String(d))
    ]);
    if (day && day.n) b.classList.add('named');
    if (done) b.append(el('span',{class:'dot'}));
    dayTabs.append(b);
  }
  inn.append(dayTabs);
  bar.append(inn); host.append(bar);

  // rola a semana ativa para o centro
  requestAnimationFrame(()=>{
    const active = wkScroller.querySelector('.wk[data-active="1"]');
    if (active) active.scrollIntoView({inline:'center', block:'nearest'});
  });
}

function renderDay(pid, w, d){
  const p = P_BY_ID[pid];
  const wkObj = p.weeks.find(x=>x.w===w);
  const day = wkObj.days.find(x=>x.d===d);
  buildSelbar(pid, w, d);
  const app=$('#app'); app.innerHTML='';

  // Cabeçalho do dia
  const head = el('section',{class:'dayhead'});
  head.append(
    el('div',{class:'crumb'},[
      el('span',{text:p.name}),
      el('span',{class:'mid',text:'·'}),
      el('span',{text:'Semana '+w})
    ]),
    el('h2',{text:'Semana '+w+' · '+dayName(pid,w,d)})
  );
  app.append(head);

  if (!day || day.st!=='p'){
    app.append(el('div',{class:'empty-state'},[
      el('div',{class:'big',text: day && day.st==='u' ? 'Sem conteúdo publicado' : 'Dia vazio'}),
      el('p',{text:'Este dia não tem treino no arquivo original. Use a navegação acima para ir a outro dia ou semana.'})
    ]));
    return;
  }

  const prog = getDay(pid,w,d);
  const stats = dayBlockStats(pid, wkObj, day);

  // meta + controles
  const meta = el('div',{class:'daymeta'});
  const ring = el('span',{class:'ring'}); ring.style.setProperty('--p', stats.total?Math.round(stats.done/stats.total*100):0);
  meta.append(el('span',{class:'mini'},[ ring, document.createTextNode(stats.done+'/'+stats.total+' exercícios') ]));
  head.append(meta);

  const controls = el('div',{class:'controls'});
  // data
  const dateInput = el('input',{type:'date', value: prog.date||''});
  dateInput.addEventListener('change', e=>{ prog.date = e.target.value||null; save(); });
  controls.append(el('div',{class:'datefield'},[ el('label',{text:'Data'}), dateInput ]));
  // compartilhar link deste treino
  const shareBtn = el('button',{class:'iconbtn share', title:'Compartilhar link deste treino', 'aria-label':'Compartilhar link deste treino', onclick:()=>shareDay(pid,w,d)},[
    el('span',{html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>'}),
    document.createTextNode('Compartilhar')
  ]);
  controls.append(shareBtn);
  // botão concluir
  const doneBtn = el('button',{class:'btn-done'+(prog.done?' is-done':'')});
  function paintDone(){
    doneBtn.classList.toggle('is-done', prog.done);
    doneBtn.innerHTML='';
    doneBtn.append(
      el('span',{html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'}),
      document.createTextNode(prog.done?'Treino concluído':'Marcar treino como concluído')
    );
  }
  doneBtn.addEventListener('click', ()=>{
    prog.done=!prog.done;
    if (prog.done && !prog.date) { prog.date=todayISO(); dateInput.value=prog.date; }
    paintDone(); save(true);
    toast(prog.done?'Treino concluído':'Marcação removida');
    // atualiza indicadores de dia/semana
    const dtab = $('#selbarHost .day-tabs .wk[data-active="1"]');
    if (dtab){ dtab.querySelector('.dot')?.remove(); if(prog.done) dtab.append(el('span',{class:'dot'})); }
    refreshWeekDot(pid, w);
  });
  paintDone();
  controls.append(doneBtn);
  head.append(controls);

  // notas gerais
  const gnotes = el('div',{class:'gnotes'});
  const ta = el('textarea',{placeholder:'Notas gerais do treino (como você se sentiu, ajustes, etc.)'});
  ta.value = prog.notes||'';
  ta.addEventListener('input', e=>{ prog.notes=e.target.value; save(); });
  gnotes.append(ta); head.append(gnotes);

  // Treino
  const workout = el('div',{class:'workout'});
  day.sec.forEach((s,si)=>{
    const color = sectionColorVar(s.l);
    const sec = el('section',{class:'sec'});
    const label = s.l ? titleCase(s.l) : 'Treino';
    sec.append(el('div',{class:'sec-head'},[
      el('span',{class:'sec-tick', style:'background:'+color}),
      el('h4',{text:label}),
      s.b.length>1 ? el('span',{class:'count',text:s.b.length+' itens'}) : null
    ]));
    s.b.forEach((b,bi)=>{
      sec.append(renderCard(pid, w, d, si, bi, b, color));
    });
    workout.append(sec);
  });
  app.append(workout);
}

function renderCard(pid, w, d, si, bi, b, color){
  const prog = getDay(pid,w,d);
  const bkey = si+'.'+bi;
  if (!prog.blocks[bkey]) prog.blocks[bkey]={done:false, load:'', note:''};
  const bp = prog.blocks[bkey];

  const card = el('div',{class:'card'+(bp.done?' checked':''), style:'--sec-c:'+color});

  const check = el('div',{class:'check', role:'checkbox', tabindex:'0',
    'aria-checked': bp.done?'true':'false', 'aria-label':'Marcar '+(b.t||'exercício')+' como concluído',
    html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'});
  function toggle(){
    bp.done=!bp.done; check.setAttribute('aria-checked', bp.done?'true':'false');
    card.classList.toggle('checked', bp.done); save();
    updateDayRing(pid, w, d);
  }
  check.addEventListener('click', toggle);
  check.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); }});

  // corpo
  const body = el('div',{class:'exbody'});
  body.append(el('div',{class:'ex-title', text:b.t||''}));

  if (b.x && b.x.length){
    const rx = el('div',{class:'rx'});
    let noteMode=false;
    b.x.forEach(line=>{
      const t=line.trim();
      if (t===''){ rx.append(el('div',{class:'spacer'})); return; }
      const nm = t.match(/^notes?:\s*(.*)$/i);
      if (nm){
        if (!noteMode){ rx.append(el('div',{class:'noteshead',text:'Observações'})); noteMode=true; }
        if (nm[1]) rx.append(el('div',{class:'note', text: nm[1]}));
        return;
      }
      const isBullet = t.startsWith('-') || t.startsWith('*');
      if (isBullet || noteMode){
        rx.append(el('div',{class:'note', text: line}));
      } else {
        rx.append(el('div',{class:'line', text: line}));
      }
    });
    body.append(rx);
  }

  card.append(el('div',{class:'card-main'},[ check, body ]));

  // log: carga + observação
  const log = el('div',{class:'log'});
  const cargaWrap = el('div',{class:'fld carga'});
  const cargaIn = el('input',{type:'text', inputmode:'text', placeholder:'ex.: 60kg / 40lb', value:bp.load||''});
  cargaIn.addEventListener('input', e=>{ bp.load=e.target.value; save(); });
  cargaWrap.append(el('label',{text:'Carga realizada'}), cargaIn);
  const noteWrap = el('div',{class:'fld'});
  const noteIn = el('input',{type:'text', placeholder:'Observação deste exercício', value:bp.note||''});
  noteIn.addEventListener('input', e=>{ bp.note=e.target.value; save(); });
  noteWrap.append(el('label',{text:'Notas'}), noteIn);
  log.append(cargaWrap, noteWrap);
  card.append(log);

  return card;
}

function updateDayRing(pid,w,d){
  const p=P_BY_ID[pid]; const wkObj=p.weeks.find(x=>x.w===w); const day=wkObj.days.find(x=>x.d===d);
  const st=dayBlockStats(pid,wkObj,day);
  const ring=$('.daymeta .ring'); if(ring) ring.style.setProperty('--p', st.total?Math.round(st.done/st.total*100):0);
  const mini=$('.daymeta .mini'); if(mini){ mini.lastChild.textContent = st.done+'/'+st.total+' exercícios'; }
}
function refreshWeekDot(pid, w){
  const p=P_BY_ID[pid]; const wk=p.weeks.find(x=>x.w===w);
  const countable=wk.days.filter(dd=>dd.c);
  const allDone=countable.length>0 && countable.every(dd=>{const pr=peekDay(pid,w,dd.d);return pr&&pr.done;});
  const btn=$('#selbarHost .wk[data-w="'+w+'"]');
  if(btn){ btn.querySelector('.dot')?.remove(); if(allDone) btn.append(el('span',{class:'dot'})); }
}

function renderHistory(){
  $('#selbarHost').innerHTML='';
  const app=$('#app'); app.innerHTML='';
  // reúne treinos concluídos ou com data
  const items=[];
  for (const k in STATE.progress){
    const pr=STATE.progress[k];
    if (!pr) continue;
    if (pr.done || pr.date){
      const [pid,w,d]=k.split('#');
      if (!P_BY_ID[pid]) continue;
      items.push({pid, w:+w, d:+d, date:pr.date||'', done:pr.done, notes:pr.notes||''});
    }
  }
  items.sort((a,b)=>{
    if (a.date && b.date) return a.date<b.date?1:(a.date>b.date?-1:0);
    if (a.date) return -1; if (b.date) return 1;
    return 0;
  });

  app.append(el('section',{class:'hist-head'},[
    el('h1',{text:'Histórico'}),
    el('p',{text: items.length? items.length+' treino'+(items.length>1?'s':'')+' registrado'+(items.length>1?'s':'') : 'Nenhum treino registrado ainda.'})
  ]));

  if (!items.length){
    app.append(el('div',{class:'empty-state'},[
      el('div',{class:'big',text:'Seu histórico começa aqui'}),
      el('p',{text:'Ao concluir um treino ou registrar a data em que treinou, ele aparece nesta lista.'})
    ]));
    return;
  }

  const list=el('div',{class:'hist-list'});
  items.forEach(it=>{
    const p=P_BY_ID[it.pid];
    const dateBox = it.date
      ? el('div',{class:'date'},[ document.createTextNode(fmtDateBR(it.date).slice(0,5)), el('small',{text:it.date.slice(0,4)}) ])
      : el('div',{class:'date'},[ document.createTextNode('—'), el('small',{text:'sem data'}) ]);
    list.append(el('button',{class:'hrow', onclick:()=>go('/'+it.pid+'/'+it.w+'/'+it.d)},[
      dateBox,
      el('div',{class:'what'},[
        el('b',{text:p.name}),
        el('span',{text:'Semana '+it.w+' · '+dayName(it.pid,it.w,it.d) + (it.done?' · concluído':'')})
      ]),
      el('span',{class:'arw', html:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'})
    ]));
  });
  app.append(list);
}

/* ============================ Ajustes (sheet) ============================ */
function openSheet(){ $('#scrim').classList.add('open'); $('#sheet').classList.add('open'); }
function closeSheet(){ $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open'); }
$('#settingsBtn').addEventListener('click', openSheet);
$('#scrim').addEventListener('click', closeSheet);
$('#optTheme').addEventListener('click', ()=>{ toggleTheme(); });
$('#brandBtn').addEventListener('click', ()=>go('/'));
$('#histBtn').addEventListener('click', ()=>go('/history'));

$('#optExport').addEventListener('click', ()=>{
  closeSheet();
  const blob=new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=el('a',{href:url, download:'flagship-progresso-'+todayISO()+'.json'});
  document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Backup exportado');
});
$('#optImport').addEventListener('click', ()=>{ closeSheet(); $('#importFile').click(); });
$('#importFile').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const data=JSON.parse(rd.result);
      if (data && typeof data==='object' && data.progress){
        STATE = { theme: data.theme||STATE.theme, progress: data.progress };
        save(true); applyTheme(); render(); toast('Dados importados');
      } else { toast('Arquivo inválido'); }
    }catch(err){ toast('Não foi possível ler o arquivo'); }
    $('#importFile').value='';
  };
  rd.readAsText(file);
});
$('#optReset').addEventListener('click', ()=>{
  closeSheet();
  if (confirm('Apagar todo o progresso, cargas e notas? Esta ação não pode ser desfeita.')){
    STATE={ theme:STATE.theme, progress:{} }; save(true); render(); toast('Progresso apagado');
  }
});

/* ============================ Início ============================ */
applyTheme();
render();
</script>
